# Coolify / Nixpacks — evitar la fase `nix-env -if .nixpacks/nixpkgs-...` (paso #8) que suele fallar
# con exit 255 por OOM/timeout al descomprimir nixpkgs en servidores pequeños.
#
# Estrategia: imagen base oficial con Node (sin Nix) + npm ci + build Next standalone.
# Alternativa en el panel Coolify: Build Pack = "Dockerfile", Base Directory = "frontend"
# (usa frontend/Dockerfile con node:22-alpine).

buildImage = "node:22-bookworm-slim"

[variables]
NODE_ENV = "production"
HOSTNAME = "0.0.0.0"
PORT = "3000"

# Sustituye los paquetes Nix del provider (no instalar nixpkgs en esta fase).
[phases.setup]
nixPkgs = []

[phases.install]
dependsOn = ["setup"]
cmds = ["npm ci"]

[phases.build]
dependsOn = ["install"]
cmds = ["npm run build"]

[start]
cmd = "npm run start"
