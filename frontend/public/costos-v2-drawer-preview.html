<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Costos V2 — Drawer preview</title>
  <style>
    :root {
      --bg: #f4f4f5;
      --panel: #ffffff;
      --border: #e4e4e7;
      --muted: #71717a;
      --fg: #18181b;
      --muted-bg: #f4f4f5;
      --accent-bg: #fafafa;
      --emerald: #047857;
      --warn-bg: #fef3c7;
      --warn-fg: #92400e;
      --danger-bg: #fee2e2;
      --danger-fg: #991b1b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #52525b;
      color: var(--fg);
      min-height: 100vh;
      display: flex;
      justify-content: flex-end;
    }
    .drawer {
      width: min(820px, 55vw);
      min-width: 360px;
      max-width: 100%;
      height: 100vh;
      background: var(--panel);
      display: flex;
      flex-direction: column;
      box-shadow: -8px 0 32px rgba(0,0,0,.25);
    }
    .header {
      padding: 20px 48px 16px 20px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .header h1 {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 650;
      letter-spacing: -0.02em;
    }
    .sub { margin: 4px 0 0; color: var(--muted); font-size: .9rem; }
    .badge {
      display: inline-block;
      margin-top: 10px;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: .75rem;
      font-weight: 550;
      background: var(--warn-bg);
      color: var(--warn-fg);
    }
    .badge.ok { background: #d1fae5; color: #065f46; }
    .badge.bad { background: var(--danger-bg); color: var(--danger-fg); }
    .badge.outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      margin-left: 6px;
    }
    .meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      margin-top: 10px;
      font-size: .875rem;
      color: var(--muted);
    }
    .meta strong { color: #3f3f46; font-weight: 500; }
    .body { flex: 1; overflow: auto; padding: 16px 20px; }
    .tabs {
      display: inline-flex;
      gap: 2px;
      background: var(--muted-bg);
      padding: 3px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: .8rem;
    }
    .tabs span {
      padding: 6px 12px;
      border-radius: 6px;
      color: var(--muted);
    }
    .tabs .active { background: white; color: var(--fg); font-weight: 550; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
    .cost-card {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      background: linear-gradient(145deg, #f4f4f5, #fff);
      margin-bottom: 14px;
    }
    .cost-card .label {
      font-size: .7rem;
      font-weight: 650;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .cost-card .amount {
      font-size: 2.25rem;
      font-weight: 650;
      letter-spacing: -0.03em;
      margin: 4px 0 10px;
      font-variant-numeric: tabular-nums;
    }
    .cost-card .row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 20px;
      font-size: .9rem;
      color: var(--muted);
    }
    .up { color: var(--emerald); font-weight: 550; }
    .flat { color: var(--muted); }
    .section {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 14px;
    }
    .section h3 {
      margin: 0 0 8px;
      font-size: .875rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .section h3 a { font-size: .75rem; color: #2563eb; text-decoration: none; font-weight: 500; }
    .section p { margin: 6px 0; font-size: .875rem; color: var(--muted); line-height: 1.45; }
    .grid2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .cell {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
    }
    .cell.em {
      background: var(--muted-bg);
      border-color: #d4d4d8;
    }
    .cell .l {
      font-size: .65rem;
      text-transform: uppercase;
      letter-spacing: .04em;
      color: var(--muted);
      font-weight: 550;
    }
    .cell .v {
      margin-top: 4px;
      font-size: .9rem;
      font-weight: 550;
      font-variant-numeric: tabular-nums;
    }
    .cell.em .v { font-size: 1.1rem; font-weight: 650; }
    .tax-row {
      display: flex;
      justify-content: space-between;
      padding: 10px 12px;
      background: var(--muted-bg);
      border-radius: 6px;
      font-size: .875rem;
      margin-top: 6px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: .8rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border); }
    th { background: var(--muted-bg); font-weight: 550; color: var(--muted); font-size: .7rem; text-transform: uppercase; }
    td.num { text-align: right; font-variant-numeric: tabular-nums; }
    tr.hl { background: #fafafa; }
    .footer {
      border-top: 1px solid var(--border);
      padding: 10px 20px;
      font-size: .7rem;
      color: var(--muted);
      flex-shrink: 0;
    }
    .shot-label {
      position: fixed;
      top: 12px;
      left: 12px;
      background: #18181b;
      color: white;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: .75rem;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div class="shot-label" id="shotLabel">JOHNNIE WALKER</div>
  <aside class="drawer" id="drawer"></aside>
  <script>
    const fixtures = {
      johnnie: {
        label: "JOHNNIE WALKER",
        name: "JOHNNIE WALKER",
        sub: "Red Label 1 LT · 5000267013602",
        badge: "Impuestos no incluidos",
        badgeClass: "",
        date: "31-07-2026",
        doc: "18358",
        cost: "$9.798",
        previous: "$9.798",
        variation: '<span class="flat">Sin variación</span>',
        statusText: "El costo bruto almacenado no incluía todos los impuestos correspondientes. Costos V2 calculó un bruto corregido agregando IVA e impuestos adicionales.",
        action: "Usar el costo corregido V2 como referencia.",
        net: "$6.510", iva: "$1.237", add: "$2.051", rate: "50,5 %",
        stored: "$6.510", corrected: "$9.798",
        taxes: [["ILA destilados 31,5 %", "$2.051"]],
        compare: { prev: "$9.798", curr: "$9.798", diff: "Sin variación", pct: "Sin variación", flat: true },
        hist: [
          ["31-07-2026", "18358", "$6.510", "$9.798", "Impuestos no incluidos", true],
          ["15-06-2026", "18001", "$6.510", "$9.798", "Impuestos no incluidos", false],
        ],
      },
      chandelle: {
        label: "CHANDELLE NESTLE",
        name: "CHANDELLE NESTLE",
        sub: "Chocolate 110g · 7613034626844",
        badge: "Costo correcto",
        badgeClass: "ok",
        date: "28-07-2026",
        doc: "19102",
        cost: "$665",
        previous: "$532",
        variation: '<span class="up">↑ $133 · +25,1 %</span>',
        statusText: "El costo bruto almacenado coincide con el neto más los impuestos esperados.",
        action: "No requiere revisión.",
        net: "$532", iva: "$101", add: "$32", rate: "25 %",
        stored: "$665", corrected: "$665",
        taxes: [["Anticipo harina 12 %", "$32"]],
        compare: { prev: "$532", curr: "$665", diff: "$133", pct: "25,1 %", flat: false },
        hist: [
          ["28-07-2026", "19102", "$532", "$665", "Costo correcto", true],
          ["10-05-2026", "17001", "$426", "$532", "Costo correcto", false],
        ],
      },
      incomplete: {
        label: "Contexto tributario incompleto",
        name: "PRODUCTO SIN CONTEXTO",
        sub: "Genérico 1 kg · 7800000000123",
        badge: "Contexto tributario incompleto",
        badgeClass: "bad",
        warn: "Sin información tributaria suficiente",
        date: "20-07-2026",
        doc: "20001",
        cost: "No calculable",
        previous: "—",
        variation: '<span class="flat">Sin variación</span>',
        statusText: "No existe información tributaria suficiente para calcular un costo bruto confiable.",
        action: "Revisar la configuración tributaria del producto.",
        net: "$1.000", iva: "—", add: "—", rate: "—",
        stored: "$1.000", corrected: "No calculable",
        taxes: [],
        compare: { prev: "—", curr: "No calculable", diff: "Sin variación", pct: "Sin variación", flat: true },
        hist: [
          ["20-07-2026", "20001", "$1.000", "No calculable", "Contexto tributario incompleto", true],
        ],
      },
    };

    function render(key) {
      const f = fixtures[key];
      document.getElementById("shotLabel").textContent = f.label;
      const taxesHtml = f.taxes.length
        ? `<div class="section"><h3>Impuestos adicionales</h3>${f.taxes.map(([n,a]) => `<div class="tax-row"><span>${n}</span><strong>${a}</strong></div>`).join("")}</div>`
        : "";
      const histHtml = f.hist.map(([d,doc,n,b,st,hl]) =>
        `<tr class="${hl ? "hl" : ""}"><td>${d}</td><td>${doc}</td><td class="num">${n}</td><td class="num"><strong>${b}</strong></td><td><span class="badge ${f.badgeClass}" style="margin:0">${st}</span></td></tr>`
      ).join("");
      document.getElementById("drawer").innerHTML = `
        <div class="header">
          <h1>${f.name}</h1>
          <p class="sub">${f.sub}</p>
          <div>
            <span class="badge ${f.badgeClass}">${f.badge}</span>
            ${f.warn ? `<span class="badge outline">${f.warn}</span>` : ""}
          </div>
          <div class="meta">
            <div><strong>Última recepción:</strong> ${f.date}</div>
            <div><strong>Documento:</strong> ${f.doc}</div>
          </div>
        </div>
        <div class="body">
          <div class="tabs"><span class="active">Resumen</span><span>Historial</span><span>Detalle técnico</span></div>
          <div class="cost-card">
            <div class="label">Costo vigente V2</div>
            <div class="amount">${f.cost}</div>
            <div class="row">
              <span>Costo anterior: <strong style="color:#3f3f46">${f.previous}</strong></span>
              ${f.variation}
            </div>
          </div>
          <div class="section">
            <h3>Estado del costo <a href="#">Ver simbología</a></h3>
            <span class="badge ${f.badgeClass}">${f.badge}</span>
            <p>${f.statusText}</p>
            <p><strong style="color:#3f3f46">Acción sugerida:</strong> ${f.action}</p>
          </div>
          <div class="section" style="border:none;padding:0">
            <h3 style="margin-bottom:8px">Desglose del costo</h3>
            <div class="grid2">
              <div class="cell"><div class="l">Costo neto</div><div class="v">${f.net}</div></div>
              <div class="cell"><div class="l">IVA</div><div class="v">${f.iva}</div></div>
              <div class="cell"><div class="l">Impuestos adicionales</div><div class="v">${f.add}</div></div>
              <div class="cell"><div class="l">Tasa total</div><div class="v">${f.rate}</div></div>
              <div class="cell"><div class="l">Bruto almacenado</div><div class="v">${f.stored}</div></div>
              <div class="cell em"><div class="l">Bruto corregido V2</div><div class="v">${f.corrected}</div></div>
            </div>
          </div>
          ${taxesHtml}
          <div class="section" style="border:none;padding:0">
            <h3 style="margin-bottom:8px">Comparación</h3>
            ${f.compare.flat ? '<p style="margin:0 0 8px;font-size:.875rem;color:#71717a">Sin variación respecto al costo anterior.</p>' : ''}
            <div class="grid2">
              <div class="cell"><div class="l">Costo anterior</div><div class="v">${f.compare.prev}</div></div>
              <div class="cell"><div class="l">Costo actual</div><div class="v">${f.compare.curr}</div></div>
              <div class="cell"><div class="l">Diferencia unitaria</div><div class="v">${f.compare.diff}</div></div>
              <div class="cell"><div class="l">Variación porcentual</div><div class="v">${f.compare.pct}</div></div>
            </div>
          </div>
          <div class="section" style="border:none;padding:0;margin-top:14px">
            <h3>Historial reciente</h3>
            <table>
              <thead><tr><th>Fecha</th><th>Documento</th><th style="text-align:right">Neto</th><th style="text-align:right">Bruto V2</th><th>Estado</th></tr></thead>
              <tbody>${histHtml}</tbody>
            </table>
          </div>
        </div>
        <div class="footer">Datos disponibles actualmente para La Quillotana SpA, Supermercado La Quillotana.</div>
      `;
    }

    const params = new URLSearchParams(location.search);
    render(params.get("f") || "johnnie");
  </script>
</body>
</html>
