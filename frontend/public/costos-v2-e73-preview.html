<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>E.7.3 Costos V2 consolidado — preview</title>
  <style>
    :root { --bg:#f4f4f5; --fg:#18181b; --muted:#71717a; --border:#e4e4e7; --card:#fff; --red:#b91c1c; --up:#047857; --down:#b91c1c; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:"Segoe UI",system-ui,sans-serif; background:var(--bg); color:var(--fg); }
    .page { max-width:1440px; margin:0 auto; padding:16px; }
    h1 { margin:0; font-size:1.5rem; }
    .sub { color:var(--muted); font-size:.9rem; margin:.25rem 0 0; }
    .meta { display:flex; flex-wrap:wrap; gap:12px 20px; font-size:.75rem; color:var(--muted); margin-top:8px; }
    .kpis { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:16px 0; }
    .kpi { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:12px; }
    .kpi .t { font-size:.65rem; text-transform:uppercase; color:var(--muted); font-weight:600; letter-spacing:.04em; }
    .kpi .v { font-size:1.6rem; font-weight:650; margin-top:4px; }
    .kpi .h { font-size:.7rem; color:var(--muted); margin-top:2px; }
    .tabs { display:inline-flex; gap:2px; background:#e4e4e7; padding:3px; border-radius:8px; font-size:.8rem; margin-bottom:12px; }
    .tabs span { padding:6px 12px; border-radius:6px; color:var(--muted); }
    .tabs .on { background:#fff; color:var(--fg); font-weight:550; }
    table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--border); border-radius:8px; overflow:hidden; font-size:.8rem; }
    th,td { padding:10px; border-bottom:1px solid var(--border); text-align:left; }
    th { background:#fafafa; font-size:.7rem; text-transform:uppercase; color:var(--muted); }
    .num { text-align:right; font-variant-numeric:tabular-nums; }
    .badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:.65rem; border:1px solid var(--border); margin:1px; }
    .down { color:var(--down); font-weight:550; }
    .label { position:fixed; top:10px; left:10px; background:#18181b; color:#fff; padding:6px 10px; border-radius:6px; font-size:.75rem; z-index:5; }
    .drawer-wrap { display:flex; justify-content:flex-end; min-height:100vh; background:#52525b; }
    .drawer { width:min(820px,55vw); background:#fff; min-height:100vh; display:flex; flex-direction:column; box-shadow:-8px 0 24px rgba(0,0,0,.25); }
    .dh { padding:16px 48px 12px 20px; border-bottom:1px solid var(--border); }
    .db { padding:16px 20px; flex:1; }
    .cost { font-size:2.2rem; font-weight:650; }
    .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .cell { border:1px solid var(--border); border-radius:8px; padding:10px; }
    .cell .l { font-size:.65rem; text-transform:uppercase; color:var(--muted); }
    .cell .v { font-weight:550; margin-top:4px; }
    .chart { height:160px; border:1px solid var(--border); border-radius:8px; background:linear-gradient(180deg,#fafafa,#fff); position:relative; margin:8px 0; }
    .chart svg { width:100%; height:100%; }
    .office { display:flex; justify-content:space-between; padding:10px 12px; border:1px solid var(--border); border-radius:8px; margin-top:6px; font-size:.85rem; }
    .muted { color:var(--muted); }
  </style>
</head>
